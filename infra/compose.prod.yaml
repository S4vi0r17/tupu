# Producción en Dokploy: solo el API sale a internet, detrás de Traefik (0009)

services:
  api:
    build:
      # La raíz del repo: necesita bun.lock y packages/ (0001)
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?falta en el entorno de Dokploy}:${POSTGRES_PASSWORD:?falta en el entorno de Dokploy}@postgis:5432/${POSTGRES_DB:?falta en el entorno de Dokploy}
      VALHALLA_URL: http://valhalla:8002
    depends_on:
      postgis:
        condition: service_healthy
    # Dokploy escribe las etiquetas de Traefik desde su pestaña Domains, hacia el puerto 3000
    networks: [internal, dokploy-network]
    restart: unless-stopped

  postgis:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta en el entorno de Dokploy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta en el entorno de Dokploy}
      POSTGRES_DB: ${POSTGRES_DB:?falta en el entorno de Dokploy}
    volumes:
      - postgis-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    command: ['valhalla_service', '/data/valhalla.json', '1']
    volumes:
      - valhalla-data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8002/status || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # De un solo uso, para osm:update. El despliegue no lo arranca (0020)
  osm:
    build: ./osm
    profiles: ['tools']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB}
      VALHALLA_URL: http://valhalla:8002
    volumes:
      - ../:/repo
      - valhalla-data:/data
    working_dir: /repo
    networks: [internal]
    depends_on:
      postgis:
        condition: service_healthy

networks:
  internal:
  # La de Dokploy, donde vive su Traefik
  dokploy-network:
    external: true

volumes:
  postgis-data:
  valhalla-data:
